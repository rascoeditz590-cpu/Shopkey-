name: Build Shopkey APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_NAME: Shopkey
      APP_ID: com.shopkey.app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          for f in www/index.html assets/icon-only.png assets/icon-foreground.png assets/splash.png; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing file: $f"
              exit 1
            fi
          done

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          [ -f package.json ] || npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install -D @capacitor/assets
          cat > capacitor.config.json <<EOF
          {
            "appId": "$APP_ID",
            "appName": "$APP_NAME",
            "webDir": "www"
          }
          EOF

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Shopkey icons and splash (replaces default logo)
        run: |
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#0F766E' \
            --iconBackgroundColorDark '#0F766E' \
            --splashBackgroundColor '#FFFFFF' \
            --splashBackgroundColorDark '#0F766E'

      - name: Sync web files
        run: npx cap sync android

      - name: Force app name and version
        run: |
          STR=android/app/src/main/res/values/strings.xml
          sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">$APP_NAME</string>|" "$STR"
          sed -i "s|<string name=\"title_activity_main\">[^<]*</string>|<string name=\"title_activity_main\">$APP_NAME</string>|" "$STR"
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          cat "$STR"

      - name: Build release APK (unsigned)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK with Shopkey key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          mkdir -p out

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > shopkey.jks
          else
            echo "::warning::No keystore secrets found. Using a TEMPORARY key. Later builds will NOT install over this one. Add the 4 secrets for a permanent key."
            KEYSTORE_PASSWORD=$(openssl rand -hex 12)
            KEY_ALIAS=shopkey
            KEY_PASSWORD=$KEYSTORE_PASSWORD
            keytool -genkeypair -v -keystore shopkey.jks -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -dname "CN=Shopkey, O=Shopkey, C=IN"
          fi
          export KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD

          "$BT/zipalign" -p -f 4 "$UNSIGNED" out/aligned.apk
          "$BT/apksigner" sign \
            --ks shopkey.jks \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out out/Shopkey.apk out/aligned.apk
          "$BT/apksigner" verify --verbose out/Shopkey.apk
          rm -f shopkey.jks out/aligned.apk

      - name: Verify app name and package
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging out/Shopkey.apk | grep -E "^package:|application-label:" || true
          "$BT/aapt2" dump badging out/Shopkey.apk | grep -q "application-label:'$APP_NAME'" \
            || { echo "::error::App name is not $APP_NAME"; exit 1; }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shopkey-APK
          path: out/Shopkey.apk
          retention-days: 30
          
