
name: ShopKey Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'shopkey-logo.png'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build ShopKey APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # FIX: Install valid Android SDK packages only
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Accept SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Check Files
        run: |
          test -f index.html
          test -f shopkey-logo.png

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7.4.3 @capacitor/android@7.4.3
          npm install -D @capacitor/cli@7.4.3

      - name: Configure ShopKey
        run: |
          mkdir -p www
          cp index.html www/index.html

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.shopkey.app",
            "appName": "ShopKey",
            "webDir": "www"
          }
          EOF

      - name: Create Android Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply Custom ShopKey Icon
        run: |
          RES=android/app/src/main/res

          mkdir -p $RES/drawable-nodpi
          mkdir -p $RES/values
          mkdir -p $RES/mipmap-anydpi-v26

          for item in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $item
            mkdir -p "$RES/mipmap-$1"
            convert shopkey-logo.png \
              -thumbnail "$2"x"$2" \
              -gravity center -background '#0F766E' \
              -extent "$2"x"$2" \
              "$RES/mipmap-$1/ic_launcher.png"
            cp "$RES/mipmap-$1/ic_launcher.png" \
              "$RES/mipmap-$1/ic_launcher_round.png"
          done

          convert shopkey-logo.png \
            -thumbnail 432x432 \
            -gravity center -background none \
            -extent 432x432 \
            $RES/drawable-nodpi/ic_launcher_foreground.png

          cat > $RES/values/shopkey_icon.xml <<'EOF'
          <resources>
            <color name="shopkey_icon_bg">#0F766E</color>
          </resources>
          EOF

          for icon in ic_launcher ic_launcher_round; do
            cat > "$RES/mipmap-anydpi-v26/$icon.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/shopkey_icon_bg"/>
            <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          done

          sed -i 's|<string name="app_name">.*</string>|<string name="app_name">ShopKey</string>|' \
            $RES/values/strings.xml

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare ShopKey APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            release/ShopKey.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ShopKey-APK
          path: release/ShopKey.apk
          if-no-files-found: error
          retention-days: 30
          
